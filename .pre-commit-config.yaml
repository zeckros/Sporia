# Pre-commit hooks — ruff scoped to src/ + tests/ only (legacy root files are not
# linted until they migrate into src/sporia/). Ruff runs via the venv install
# (language: system) so the version matches CI exactly.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (src, tests)
        entry: ruff check --fix
        language: system
        types: [python]
        files: ^(src|tests)/
      - id: ruff-format
        name: ruff format (src, tests)
        entry: ruff format
        language: system
        types: [python]
        files: ^(src|tests)/
