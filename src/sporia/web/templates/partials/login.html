  <!-- ============ ÉCRAN D'AUTH UNIFIÉ (connexion / inscription) — DA ============ -->
  <div id="login-screen" class="hidden fixed inset-0 z-50 overflow-auto bg-sousbois text-os">
    <div class="da-grain fixed inset-0"></div>
    <div class="relative min-h-screen grid md:grid-cols-2">

      <!-- Panneau gauche : DA + collage (masqué en mobile) -->
      <div class="relative overflow-hidden hidden md:flex flex-col justify-between p-10"
           style="background:
             radial-gradient(640px 380px at 84% 4%, rgba(242,169,59,.24) 0%, transparent 54%),
             radial-gradient(720px 560px at -5% 105%, rgba(120,158,80,.22) 0%, transparent 58%),
             linear-gradient(155deg,#1c1712 0%, #191510 60%, #120e0a 100%)">
        <button class="back-landing font-display font-extrabold text-2xl uppercase tracking-tight text-os hover:text-girolle transition text-left" title="Retour à l'accueil">Sporia</button>

        <div class="relative flex-1 flex items-center justify-center my-6" aria-hidden="true">
          <div class="absolute rounded-full" style="width:360px;height:360px;background:radial-gradient(circle,rgba(242,169,59,.20),transparent 68%)"></div>
          <img src="/static/img/shrooms/coulemelle.png" alt="" class="relative drop-shadow-2xl" style="width:250px;transform:rotate(-3deg)">
        </div>

        <div>
          <div class="font-display font-extrabold uppercase leading-[0.95] text-3xl text-os">Trouvez les <span class="font-serif italic normal-case text-girolle">bons</span><br>champignons.</div>
          <div class="mt-3 font-mono text-xs uppercase tracking-wide text-os/50">Météo · forêts · sol · relief — sur une seule carte.</div>
        </div>
      </div>

      <!-- Panneau droit : bascule + formulaires -->
      <div class="relative flex items-center justify-center p-8" style="background:#0e0a06">
        <div class="w-full max-w-sm">
          <button type="button" class="back-landing font-display font-extrabold text-girolle text-lg uppercase tracking-tight hover:opacity-80 transition md:hidden" title="Retour à l'accueil">Sporia</button>

          <!-- Sélecteur de mode -->
          <div class="mt-2 flex rounded-sm border-2 border-os/15 p-1">
            <button type="button" data-auth-mode="login" class="auth-tab flex-1 py-2 rounded-sm font-bold text-sm bg-girolle text-sousbois transition">Connexion</button>
            <button type="button" data-auth-mode="register" class="auth-tab flex-1 py-2 rounded-sm font-bold text-sm text-os/60 transition">Créer un compte</button>
          </div>

          <!-- Connexion -->
          <form id="login-form" class="mt-6">
            <h2 class="font-display font-extrabold text-2xl uppercase text-os">Bon retour</h2>
            <p class="mt-1 text-sm text-os/50 mb-5">Connectez-vous pour accéder à la carte et au guide.</p>
            <label class="block font-mono text-[11px] uppercase tracking-wide text-os/50 mb-1">Email</label>
            <input id="login-user" type="email" autocomplete="email"
                   class="w-full mb-3 px-3 py-2.5 rounded-sm bg-sousbois border border-os/20 text-os focus:border-girolle focus:ring-2 focus:ring-girolle/30 outline-none" />
            <label class="block font-mono text-[11px] uppercase tracking-wide text-os/50 mb-1">Mot de passe</label>
            <input id="login-pass" type="password" autocomplete="current-password"
                   class="w-full mb-2 px-3 py-2.5 rounded-sm bg-sousbois border border-os/20 text-os focus:border-girolle focus:ring-2 focus:ring-girolle/30 outline-none" />
            <p id="login-error" class="hidden text-sm text-red-400 mb-2"></p>
            <button type="submit" class="mt-3 w-full py-2.5 rounded-sm bg-girolle hover:bg-lactaire text-sousbois font-bold transition">Se connecter</button>
            <button type="button" id="forgot-link" class="mt-3 w-full text-sm text-os/50 hover:text-girolle transition">Mot de passe oublié ?</button>
          </form>

          <!-- Inscription (déplacée depuis la landing) -->
          <form id="register-form" class="mt-6 hidden">
            <h2 class="font-display font-extrabold text-2xl uppercase text-os">Créer un compte</h2>
            <p class="mt-1 text-sm text-os/50 mb-1">Inscrivez-vous, puis activez votre abonnement.</p>
            <p class="mb-5 text-xs text-os/60">Tout compris — <span class="font-bold text-girolle" data-price-label>15 €/an</span>, résiliable à tout moment.</p>
            <label class="block font-mono text-[11px] uppercase tracking-wide text-os/50 mb-1">Nom (optionnel)</label>
            <input id="reg-name" type="text" maxlength="80"
                   class="w-full mb-3 px-3 py-2.5 rounded-sm bg-sousbois border border-os/20 text-os focus:border-girolle focus:ring-2 focus:ring-girolle/30 outline-none" />
            <label class="block font-mono text-[11px] uppercase tracking-wide text-os/50 mb-1">Email</label>
            <input id="reg-email" type="email" required maxlength="120" autocomplete="email"
                   class="w-full mb-3 px-3 py-2.5 rounded-sm bg-sousbois border border-os/20 text-os focus:border-girolle focus:ring-2 focus:ring-girolle/30 outline-none" />
            <label class="block font-mono text-[11px] uppercase tracking-wide text-os/50 mb-1">Mot de passe (min 8)</label>
            <input id="reg-pass" type="password" required minlength="8" autocomplete="new-password"
                   class="w-full mb-2 px-3 py-2.5 rounded-sm bg-sousbois border border-os/20 text-os focus:border-girolle focus:ring-2 focus:ring-girolle/30 outline-none" />
            <button type="submit" class="mt-3 w-full py-2.5 rounded-sm bg-girolle hover:bg-lactaire text-sousbois font-bold transition">Créer mon compte</button>
            <p id="reg-msg" class="hidden text-sm font-semibold"></p>
          </form>

          <!-- Lien bêta + retour -->
          <div class="mt-6 pt-4 border-t border-os/10 text-center">
            <button type="button" class="goto-beta text-sm text-os/60 hover:text-girolle font-semibold transition">Pas prêt à payer ? Devenir bêta-testeur — gratuit</button>
            <button type="button" class="back-landing block w-full mt-3 text-xs text-os/40 hover:text-os transition">← Retour à l'accueil</button>
          </div>
        </div>
      </div>
    </div>
  </div>
