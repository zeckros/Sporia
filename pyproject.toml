[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sporia"
version = "0.1.0"
description = "Sporia — prévision de cueillette de champignons en France"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "starlette>=1.3.1",   # CVE fix (via FastAPI)
    "uvicorn[standard]",
    "itsdangerous",
    "bcrypt",
    "PyYAML",
    "python-dotenv>=1.2.2",
    "schedule",
    "xarray",
    "rioxarray",
    "rasterio",
    "geopandas>=1.1.2",
    "pandas",
    "numpy",
    "scipy",
    "h5py",
    "netcdf4",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "matplotlib",
    "fonttools>=4.60.2",  # CVE fix (via matplotlib)
    "Pillow>=12.2.0",
    "scikit-learn>=1.7,<1.8",
    "stripe>=9,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.5", "httpx", "pip-audit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sporia = ["data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests needing heavier geo/render deps"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]
